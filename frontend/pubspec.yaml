name: frontend
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Gestion d'état (architecture MVVM)
  flutter_riverpod: ^2.5.1

  # Base de données locale pour travailler sans connexion internet
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.3
  path: ^1.8.3
  path_provider: ^2.1.3

  # Firebase (cloud, synchro quand connexion disponible)
  # ⚠️ DÉSACTIVÉ TEMPORAIREMENT : Firebase ne supporte pas officiellement
  # Windows desktop (erreur CMake sur le SDK C++). À réactiver seulement
  # quand on testera sur Android (émulateur ou téléphone), pas sur Windows.
  # firebase_core: ^3.1.0
  # cloud_firestore: ^5.0.1
  # firebase_storage: ^12.1.0

  # Capture des photos (candidats et cartes CIN)
  image_picker: ^1.0.7

  # Archivage en .zip (clôture de session par CISCO)
  archive: ^3.6.1

  # Diagrammes en bâtonnets pour les statistiques admin
  fl_chart: ^0.68.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true