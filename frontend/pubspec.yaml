name: frontend
description: "Application de gestion des examens CEPE et BEPC — CISCO Vohibato."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Gestion d'état (architecture MVVM)
  flutter_riverpod: ^2.5.1

  path: ^1.8.3
  path_provider: ^2.1.3

  # Firebase (cloud, données texte partagées entre les 45 établissements
  # et l'admin CISCO — voir lib/services/firebase_service.dart).
  firebase_core: ^3.1.0
  cloud_firestore: ^5.0.1
  firebase_auth: ^5.1.0
  firebase_storage: ^12.1.0

  # Sélection temporaire d'une image avant envoi Firebase Storage
  image_picker: ^1.0.7

  # Archivage en .zip (clôture de session par CISCO)
  archive: ^3.6.1

  # Diagrammes en bâtonnets pour les statistiques admin
  fl_chart: ^0.68.0

  # Export PDF (alternative à Excel pour les listes de candidats/membres)
  pdf: ^3.11.1
  sqflite: ^2.4.2+1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.jpg