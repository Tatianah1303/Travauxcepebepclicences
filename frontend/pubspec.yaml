name: frontend
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Gestion d'état (architecture MVVM)
  flutter_riverpod: ^2.5.1

  # Base de données locale pour travailler sans connexion internet
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.3
  path: ^1.8.3
  path_provider: ^2.1.3

  # Firebase (cloud, chat temps réel établissement ↔ CISCO)
  # ⚠️ DÉSACTIVÉ TEMPORAIREMENT pour tester sur Windows sans déployer.
  # Le chat fonctionne pour l'instant avec SQLite local (voir
  # local_chat_service.dart). Réactiver ces lignes + swap vers
  # firebase_chat_service.dart quand prêt à déployer réellement.
  # firebase_core: ^3.1.0
  # cloud_firestore: ^5.0.1

  # Capture des photos (candidats et cartes CIN)
  image_picker: ^1.0.7

  # Archivage en .zip (clôture de session par CISCO)
  archive: ^3.6.1

  # Diagrammes en bâtonnets pour les statistiques admin
  fl_chart: ^0.68.0

  # Export PDF (alternative à Excel pour les listes de candidats/membres)
  pdf: ^3.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true